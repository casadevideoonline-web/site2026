<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Dashboards | b.rocket Digital Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #f4f5f8;
      color: #0c0d0e;
    }
    .font-display { font-family: "Space Grotesk", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }

    .tactile-raised {
      background: #fdfefe;
      box-shadow: 
        0px 1px 2px rgba(0, 0, 0, 0.02),
        8px 12px 28px -4px rgba(13, 20, 33, 0.06),
        -8px -8px 24px -2px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
    }

    .tactile-sunken {
      background: #f1f2f5;
      box-shadow: 
        inset 4px 4px 10px rgba(13, 20, 33, 0.05),
        inset -6px -6px 12px rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.015);
      border-radius: 16px;
    }

    .text-tactile-3d-dark {
      color: #18181b;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.4), 3px 3px 6px rgba(13, 20, 33, 0.12);
    }

    .grid-blueprint {
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.015) 1px, transparent 1px);
      background-size: 16px 16px, 16px 16px;
    }
  </style>
</head>
<body class="grid-blueprint min-h-screen flex items-center justify-center p-6 antialiased">

  <div class="max-w-md w-full">
    <!-- Brand Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-3 group mb-3">
        <div class="w-12 h-12 rounded-2xl bg-zinc-950 flex items-center justify-center border border-zinc-800 shadow-lg shrink-0 relative overflow-hidden">
          <div class="w-[30px] h-[30px] rounded-full border border-white/95 bg-white shadow-[inset_1px_1px_2px_rgba(0,0,0,0.15)] relative flex items-center justify-center overflow-hidden">
            <div class="w-[20px] h-[14px] bg-zinc-950 rounded-[4px] relative overflow-hidden shadow-inner mt-[-1.5px] border border-zinc-900/40">
              <div class="absolute top-[0.5px] left-[1px] w-[4px] h-[5px] bg-white/40 rounded-full rotate-12"></div>
              <div class="absolute bottom-0 right-0 w-[5px] h-[4px] bg-emerald-500/80 blur-[0.5px] rounded-full"></div>
            </div>
            <div class="absolute bottom-[2.5px] w-[12px] h-[2px] bg-zinc-300 rounded-full"></div>
          </div>
        </div>
        <span class="font-display font-black text-2xl tracking-[0.08em] text-zinc-950 uppercase">b.rocket <span class="text-indigo-600">*</span></span>
      </div>
      <p class="font-mono text-xs text-zinc-500 font-bold uppercase tracking-widest">Portal Restrito de Marketing Digital</p>
    </div>

    <!-- Login Card -->
    <div class="tactile-raised p-8 rounded-3xl bg-white border border-zinc-200 shadow-xl space-y-6">
      <div>
        <h1 class="font-display font-black text-xl text-zinc-950 uppercase text-tactile-3d-dark">Acessar Painel do Cliente</h1>
        <p class="font-sans text-xs text-zinc-500 mt-1">Digite suas credenciais corporativas fornecidas pela b.rocket</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-mono">
        <strong class="font-bold">⚠️ Acesso Negado:</strong> Usuário ou senha incorretos.
      </div>

      <form id="loginForm" onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="font-mono text-[11px] text-zinc-600 uppercase font-bold tracking-wider block mb-1.5">Usuário de Acesso</label>
          <div class="tactile-sunken px-4 py-3 flex items-center gap-2">
            <span class="text-zinc-400">👤</span>
            <input type="text" id="usuario" required placeholder="Ex: casadevideo" class="w-full bg-transparent outline-none font-mono text-sm text-zinc-900 placeholder:text-zinc-400" />
          </div>
        </div>

        <div>
          <label class="font-mono text-[11px] text-zinc-600 uppercase font-bold tracking-wider block mb-1.5">Senha Corporativa</label>
          <div class="tactile-sunken px-4 py-3 flex items-center gap-2">
            <span class="text-zinc-400">🔒</span>
            <input type="password" id="senha" required placeholder="••••••••••••" class="w-full bg-transparent outline-none font-mono text-sm text-zinc-900 placeholder:text-zinc-400" />
          </div>
        </div>

        <button type="submit" class="tactile-raised w-full !bg-[#4353ff] text-white font-mono text-xs font-bold py-3.5 rounded-xl shadow-lg border-t border-[#606fff] uppercase tracking-wider hover:bg-[#3240e6] transition-all hover:scale-[1.02] cursor-pointer">
          Entrar no Dashboard →
        </button>
      </form>
    </div>

    <footer class="mt-8 text-center font-mono text-[11px] text-zinc-400">
      Casa de Vídeo Produções • b.rocket Digital Engine *
    </footer>
  </div>

  <script>
    if (sessionStorage.getItem('b_rocket_session') === 'cdv_authenticated') {
      window.location.href = './Hub_Central_Marketing.html';
    }

    function realizarLogin(e) {
      e.preventDefault();
      const user = document.getElementById('usuario').value.trim();
      const pass = document.getElementById('senha').value.trim();

      if (user === 'casadevideo' && pass === 'cdv2026@rocket') {
        sessionStorage.setItem('b_rocket_session', 'cdv_authenticated');
        sessionStorage.setItem('b_rocket_user', 'Casa de Vídeo Produções');
        window.location.href = './Hub_Central_Marketing.html';
      } else {
        document.getElementById('alertBox').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
